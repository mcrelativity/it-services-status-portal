name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-status-portal

jobs:
  deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$VERSION" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "Version invalida en VERSION: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810100780158:role/devops-status-portal-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx build             --platform linux/arm64             --push             -t "$REGISTRY/$ECR_REPOSITORY:$VERSION"             .

      - name: Locate application instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances             --filters "Name=tag:Project,Values=devops-status-portal" "Name=instance-state-name,Values=running"             --query 'Reservations[0].Instances[0].InstanceId'             --output text)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No se encontro una instancia activa del proyecto"
            exit 1
          fi
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy container through AWS Systems Manager
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMAND_ID=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name "AWS-RunShellScript"             --comment "Deploy $VERSION from GitHub Actions"             --parameters commands="[
              \"set -euxo pipefail\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/$ECR_REPOSITORY:$VERSION\",
              \"docker rm -f devops-status-portal || true\",
              \"docker run -d --restart unless-stopped --name devops-status-portal -p 80:8000 -e APP_ENV=production -e APP_VERSION=$VERSION -e DEPLOYED_AT=$DEPLOYED_AT $REGISTRY/$ECR_REPOSITORY:$VERSION\",
              \"sleep 5\",
              \"curl --fail http://127.0.0.1/health\"
            ]"             --query 'Command.CommandId'             --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"             --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify public application
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          PUBLIC_DNS=$(aws ec2 describe-instances             --instance-ids "$INSTANCE_ID"             --query 'Reservations[0].Instances[0].PublicDnsName'             --output text)
          for attempt in {1..12}; do
            if curl --fail --silent "http://$PUBLIC_DNS/health" | tee /tmp/health.json; then
              grep -q "\"version\":\"$VERSION\"" /tmp/health.json
              echo "Deployment verified at http://$PUBLIC_DNS"
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed"
          exit 1
